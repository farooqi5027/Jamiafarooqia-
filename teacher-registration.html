<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Registration - Jamia Farooqia</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f1f6f3;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#075c3b,#0b7a50);
    color:white;
    padding:22px 15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.header img{
    width:75px;
    height:75px;
    object-fit:contain;
    background:white;
    border-radius:50%;
    padding:6px;
    margin-bottom:8px;
}

.header h1{
    margin:4px 0;
    font-size:24px;
}

.header p{
    margin:5px 0 0;
    font-size:14px;
    opacity:.9;
}

.container{
    width:95%;
    max-width:950px;
    margin:25px auto;
}

.form-card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.form-title{
    text-align:center;
    color:#075c3b;
    margin-top:0;
    margin-bottom:25px;
    font-size:23px;
}

.section-title{
    color:#075c3b;
    font-size:17px;
    font-weight:bold;
    margin:25px 0 15px;
    padding-bottom:8px;
    border-bottom:2px solid #e5eee9;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1 / -1;
}

label{
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
    color:#333;
}

.required{
    color:#d60000;
}

input,
select,
textarea{
    width:100%;
    padding:12px 13px;
    border:1px solid #cfd9d4;
    border-radius:9px;
    font-size:15px;
    outline:none;
    background:#fff;
    transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#08764c;
    box-shadow:0 0 0 3px rgba(8,118,76,.10);
}

textarea{
    min-height:100px;
    resize:vertical;
}

input[readonly]{
    background:#f3f5f4;
    cursor:not-allowed;
}

/* Camera */
.camera-box{
    border:2px dashed #9db8aa;
    border-radius:14px;
    padding:15px;
    text-align:center;
    background:#f8fbf9;
}

video,
#photoPreview{
    width:100%;
    max-width:430px;
    height:280px;
    object-fit:cover;
    border-radius:12px;
    background:#111;
    display:block;
    margin:0 auto 12px;
}

#photoPreview{
    display:none;
}

.camera-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.btn{
    border:none;
    border-radius:8px;
    padding:11px 17px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn-camera{
    background:#075c3b;
    color:white;
}

.btn-capture{
    background:#0b7a50;
    color:white;
}

.btn-gallery{
    background:#e9efec;
    color:#164c38;
}

.btn-retake{
    background:#fff0f0;
    color:#b00000;
}

.btn:hover{
    opacity:.9;
}

#galleryInput{
    display:none;
}

.photo-status{
    font-size:13px;
    margin-top:10px;
    color:#666;
}

/* Payment */
.payment-options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.payment-option{
    position:relative;
}

.payment-option input{
    position:absolute;
    opacity:0;
}

.payment-option label{
    display:block;
    text-align:center;
    padding:12px;
    border:1px solid #cfd9d4;
    border-radius:9px;
    cursor:pointer;
    margin:0;
    font-weight:bold;
    background:#fff;
}

.payment-option input:checked + label{
    background:#075c3b;
    color:white;
    border-color:#075c3b;
}

/* Agreement */
.agreement{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-top:25px;
    padding:14px;
    background:#f5faf7;
    border-radius:10px;
}

.agreement input{
    width:18px;
    height:18px;
    margin-top:2px;
}

.agreement label{
    margin:0;
    font-weight:normal;
    line-height:1.5;
}

/* Submit */
.submit-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#075c3b,#0b7a50);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:hover{
    opacity:.92;
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:13px;
    border-radius:9px;
    margin-top:18px;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#e7f7ed;
    color:#126b3f;
}

.error{
    background:#ffecec;
    color:#b00000;
}

.footer{
    text-align:center;
    padding:20px;
    color:#666;
    font-size:13px;
}

/* Mobile */
@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }

    .form-card{
        padding:17px;
    }

    .header h1{
        font-size:21px;
    }

    .payment-options{
        grid-template-columns:1fr;
    }

    video,
    #photoPreview{
        height:240px;
    }
}
</style>
</head>

<body>

<header class="header">

    <img src="logo.png" alt="Jamia Farooqia Logo">

    <h1>Jamia Farooqia Online Quran Academy</h1>

    <p>Teacher Registration Form</p>

</header>


<div class="container">

<div class="form-card">

<h2 class="form-title">Teacher Registration</h2>

<form id="teacherForm">

<!-- ================= BASIC INFORMATION ================= -->

<div class="section-title">
    Basic Information
</div>

<div class="grid">

    <div class="field">
        <label>Registration Date <span class="required">*</span></label>
        <input type="date" id="registrationDate" required>
    </div>

    <div class="field">
        <label>Job Type <span class="required">*</span></label>

        <select id="jobType" required>
            <option value="">Select Job Type</option>
            <option value="Full Time">Full Time</option>
            <option value="Part Time">Part Time</option>
        </select>
    </div>

</div>


<!-- ================= TEACHER PHOTO ================= -->

<div class="section-title">
    Teacher Image
</div>

<div class="camera-box">

    <video id="camera" autoplay playsinline></video>

    <img id="photoPreview" alt="Teacher Photo Preview">

    <canvas id="canvas" style="display:none;"></canvas>

    <div class="camera-buttons">

        <button type="button"
                class="btn btn-camera"
                id="startCameraBtn">
            📷 Start Camera
        </button>

        <button type="button"
                class="btn btn-capture"
                id="captureBtn">
            📸 Capture Photo
        </button>

        <button type="button"
                class="btn btn-gallery"
                id="galleryBtn">
            🖼 Choose From Gallery
        </button>

        <button type="button"
                class="btn btn-retake"
                id="retakeBtn"
                style="display:none;">
            🔄 Retake
        </button>

    </div>

    <input
        type="file"
        id="galleryInput"
        accept="image/*">

    <div class="photo-status" id="photoStatus">
        Teacher photo is required.
    </div>

</div>


<!-- ================= PERSONAL INFORMATION ================= -->

<div class="section-title">
    Personal Information
</div>

<div class="grid">

    <div class="field">
        <label>Teacher Name <span class="required">*</span></label>
        <input
            type="text"
            id="teacherName"
            placeholder="Enter teacher full name"
            required>
    </div>


    <div class="field">
        <label>Gender <span class="required">*</span></label>

        <select id="gender" required>

            <option value="">Select Gender</option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

        </select>
    </div>


    <!-- MARITAL STATUS DIRECTLY BELOW GENDER -->

    <div class="field">
        <label>Marital Status <span class="required">*</span></label>

        <select id="maritalStatus" required>

            <option value="">Select Marital Status</option>

            <option value="Single">
                Single / Unmarried
            </option>

            <option value="Married">
                Married
            </option>

            <option value="Divorced">
                Divorced
            </option>

            <option value="Widowed">
                Widowed
            </option>

        </select>
    </div>


    <div class="field">
        <label>Date of Birth <span class="required">*</span></label>

        <input
            type="date"
            id="dateOfBirth"
            required>
    </div>


    <div class="field">
        <label>Age</label>

        <input
            type="text"
            id="age"
            placeholder="Automatic"
            readonly>
    </div>


    <div class="field">
        <label>CNIC <span class="required">*</span></label>

        <input
            type="text"
            id="cnic"
            placeholder="XXXXX-XXXXXXX-X"
            maxlength="15"
            required>
    </div>


    <div class="field">
        <label>Father Name <span class="required">*</span></label>

        <input
            type="text"
            id="fatherName"
            placeholder="Enter father name"
            required>
    </div>

</div>


<!-- ================= JOINING & LOCATION ================= -->

<div class="section-title">
    Joining & Address
</div>

<div class="grid">

    <div class="field">
        <label>Date of Joining <span class="required">*</span></label>

        <input
            type="date"
            id="joiningDate"
            required>
    </div>


    <div class="field">
        <label>City <span class="required">*</span></label>

        <input
            type="text"
            id="city"
            placeholder="Enter city"
            required>
    </div>


    <div class="field">
        <label>Country <span class="required">*</span></label>

        <input
            type="text"
            id="country"
            value="Pakistan"
            required>
    </div>


    <div class="field full">
        <label>Complete Address <span class="required">*</span></label>

        <textarea
            id="address"
            placeholder="Enter complete residential address"
            required></textarea>
    </div>

</div>


<!-- ================= CONTACT ================= -->

<div class="section-title">
    Contact Information
</div>

<div class="grid">

    <div class="field">
        <label>Gmail <span class="required">*</span></label>

        <input
            type="email"
            id="gmail"
            placeholder="example@gmail.com"
            required>
    </div>


    <div class="field">
        <label>Mobile Number <span class="required">*</span></label>

        <input
            type="tel"
            id="mobile"
            placeholder="03XXXXXXXXX"
            maxlength="11"
            required>
    </div>


    <div class="field">
        <label>WhatsApp Number <span class="required">*</span></label>

        <input
            type="tel"
            id="whatsapp"
            placeholder="03XXXXXXXXX"
            maxlength="11"
            required>
    </div>

</div>


<!-- ================= EXPERIENCE & SALARY ================= -->

<div class="section-title">
    Teaching & Salary Information
</div>

<div class="grid">

    <div class="field">
        <label>Teaching Experience <span class="required">*</span></label>

        <input
            type="text"
            id="teachingExperience"
            placeholder="e.g. 5 Years"
            required>
    </div>


    <div class="field">
        <label>Monthly Salary <span class="required">*</span></label>

        <input
            type="number"
            id="monthlySalary"
            placeholder="Enter monthly salary"
            min="0"
            required>
    </div>

</div>


<!-- ================= PAYMENT ================= -->

<div class="section-title">
    Payment Method
</div>

<div class="payment-options">

    <div class="payment-option">

        <input
            type="radio"
            id="jazzcash"
            name="paymentMethod"
            value="JazzCash"
