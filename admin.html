<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Jamia Farooqia</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef5ef;
    padding:20px;
}

.card{
    max-width:420px;
    margin:40px auto;
    background:#fff;
    padding:28px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

h1{
    text-align:center;
    color:#0a5c36;
    margin-bottom:8px;
}

h2{
    text-align:center;
    color:#333;
    margin-bottom:25px;
    font-size:22px;
}

label{
    display:block;
    margin:15px 0 6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:8px;
    background:#0a5c36;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#message{
    text-align:center;
    margin-top:15px;
    line-height:1.6;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#0a5c36;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="card">

    <h1>Jamia Farooqia</h1>

    <h2>Admin Login</h2>

    <label>Admin Email / ID:</label>
    <input
        type="email"
        id="email"
        placeholder="Enter Admin Email"
        autocomplete="username"
    >

    <label>Password:</label>
    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        autocomplete="current-password"
    >

    <button id="loginBtn">
        Admin Login
    </button>

    <div id="message"></div>

    <a class="back" href="index.html">
        ← Back to Home Page
    </a>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {

    apiKey: "APNI_API_KEY_YAHAN_LIKHEIN",

    authDomain:
        "APNA_PROJECT.firebaseapp.com",

    databaseURL:
        "https://APNA_PROJECT-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "APNA_PROJECT",

    storageBucket:
        "APNA_PROJECT.firebasestorage.app",

    messagingSenderId:
        "APNA_SENDER_ID",

    appId:
        "APNA_APP_ID"
};


firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const message =
    document.getElementById("message");


function showMessage(text,color){

    message.innerHTML = text;
    message.style.color = color;

}


function makeKey(email){

    return email
        .toLowerCase()
        .trim()
        .replace(/[.#$[\]]/g,"_");

}


document.getElementById("loginBtn").onclick = async function(){

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("password")
        .value;


    if(!email){

        showMessage(
            "Admin Email / ID likhein.",
            "red"
        );

        return;
    }


    if(!password){

        showMessage(
            "Password likhein.",
            "red"
        );

        return;
    }


    try{

        const key = makeKey(email);

        const snapshot =
            await db.ref("users/" + key).get();


        if(!snapshot.exists()){

            showMessage(
                "Admin account nahi mila.",
                "red"
            );

            return;
        }


        const user = snapshot.val();


        if(user.role !== "admin"){

            showMessage(
                "Ye Admin account nahi hai.",
                "red"
            );

            return;
        }


        if(user.password !== password){

            showMessage(
                "Password ghalat hai.",
                "red"
            );

            return;
        }


        if(user.status !== "approved"){

            showMessage(
                "Admin account approved nahi hai.",
                "#b77900"
            );

            return;
        }


        const sessionId =
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .slice(2);


        await db.ref("users/" + key).update({

            isOnline:true,

            sessionId:sessionId,

            lastLogin:Date.now()

        });


        localStorage.setItem(
            "jamia_admin_email",
            email
        );


        localStorage.setItem(
            "jamia_admin_session",
            sessionId
        );


        localStorage.setItem(
            "jamia_admin_login",
            "true"
        );


        showMessage(
            "Admin Login ho gaya.<br>Admin Panel khul raha hai...",
            "green"
        );


        setTimeout(function(){

            window.location.href =
                "app-activation.html";

        },1000);


    }catch(error){

        console.error(error);

        showMessage(
            "Login mein masla aa gaya.",
            "red"
        );

    }

};

</script>

</body>
</html>
