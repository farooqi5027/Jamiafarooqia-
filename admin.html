<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Jamia Farooqia</title>
<style>
body{font-family:Arial;background:#f2f7f3;margin:0}
.header{background:#0b5d3a;color:white;padding:15px;text-align:center;font-weight:bold}
.card{background:white;margin:15px;padding:15px;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.btn{background:#0b5d3a;color:white;padding:8px 15px;border:none;border-radius:8px}
table{width:100%;border-collapse:collapse} td,th{border:1px solid #ddd;padding:8px;font-size:14px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="header">Jamia Farooqia - ADMIN PANEL<br><small>All Admissions Data</small></div>

<div class="card">
<h3>Students Registration Data</h3>
<table id="studentTable"><tr><th>Name</th><th>Father</th><th>Mobile</th><th>Course</th><th>Date</th></tr></table>
</div>

<div class="card">
<h3>Teachers Registration Data</h3>
<table id="teacherTable"><tr><th>Name</th><th>Mobile</th><th>Qualification</th><th>Date</th></tr></table>
</div>

<script>
// Yahan apna Firebase Config lagao (Project Settings se)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Student Data Lana
db.collection("students").orderBy("timestamp","desc").onSnapshot(snapshot => {
  let html = "<tr><th>Name</th><th>Father</th><th>Mobile</th><th>Course</th><th>Date</th></tr>";
  snapshot.forEach(doc => {
    let d = doc.data();
    html += `<tr><td>${d.studentName||''}</td><td>${d.fatherName||''}</td><td>${d.mobile||''}</td><td>${d.course||''}</td><td>${d.date||''}</td></tr>`;
  });
  document.getElementById("studentTable").innerHTML = html;
});

// Teacher Data Lana
db.collection("teachers").orderBy("timestamp","desc").onSnapshot(snapshot => {
  let html = "<tr><th>Name</th><th>Mobile</th><th>Qualification</th><th>Date</th></tr>";
  snapshot.forEach(doc => {
    let d = doc.data();
    html += `<tr><td>${d.teacherName||''}</td><td>${d.mobile||''}</td><td>${d.qualification||''}</td><td>${d.date||''}</td></tr>`;
  });
  document.getElementById("teacherTable").innerHTML = html;
});
</script>
</body>
</html>
