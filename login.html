<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Jamia Farooqia</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#080d09;color:#fff;font-family:Arial,sans-serif}
.container{max-width:450px;margin:auto;background:#111b14;border:2px solid #d4af37;border-radius:12px;padding:22px}
h1,h2{text-align:center;color:#e2c15a;margin:5px}
label{display:block;margin:15px 0 6px;font-weight:bold;color:#f0d77e}
input,select{width:100%;padding:13px;border:1px solid #b99a39;border-radius:7px;font-size:16px;background:#fff;color:#111}
button{width:100%;padding:14px;margin-top:14px;background:#17633b;color:#fff;border:0;border-radius:7px;font-size:18px;font-weight:bold;cursor:pointer}
.btn2{background:#8a6d1a}
#message{margin-top:15px;text-align:center;font-weight:bold;line-height:1.6}
.note{color:#ddd;font-size:13px;line-height:1.7;text-align:center}
a{color:#e2c15a;text-decoration:none}
.top-link{display:block;text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<div class="container">
<a class="top-link" href="index.html">← Wapis Home Page par jayein</a>
<h1>جامعہ فاروقیہ</h1>
<h2>Login / لاگ ان</h2>
<p class="note">Apna Mobile Number aur Password likhein.<br>1 Number se 1 hi banda Login ho sakta hai.</p>

<label>I am / میں ہوں *</label>
<select id="role">
<option value="student">Student / Parents</option>
<option value="teacher">Teacher</option>
</select>

<label>Mobile Number / موبائل نمبر *</label>
<input type="tel" id="phone" placeholder="03001234567" maxlength="11">

<label>Password / پاسورڈ *</label>
<input type="password" id="password" placeholder="Apna Password">

<button id="loginBtn">Login / لاگ ان کریں</button>
<button id="signupBtn" class="btn2">New Account Banayein / نیا اکاؤنٹ بنائیں</button>
<button id="logoutBtn" style="background:#5a1a1a;display:none">Logout / لاگ آؤٹ</button>

<div id="message"></div>
<p class="note"><a href="index.html">← Wapis Home Page par jayein</a><br><a href="admission.html">Admission Form Bharain →</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
// === APNI FIREBASE CONFIG YAHAN LAGAYEIN ===
// Firebase Console > Project Settings > Web App se copy karke yahan paste karein
const firebaseConfig = {
  apiKey: "APNI_API_KEY_YAHAN_LIKHEIN",
  authDomain: "APNA_PROJECT.firebaseapp.com",
  databaseURL: "https://APNA_PROJECT-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "APNA_PROJECT",
  storageBucket: "APNA_PROJECT.firebasestorage.app",
  messagingSenderId: "APNA_SENDER_ID",
  appId: "APNA_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const msg = document.getElementById("message");
function show(t,c){ msg.style.color=c; msg.innerHTML=t; }

document.getElementById("signupBtn").onclick = async ()=>{
  const phone=document.getElementById("phone").value.trim();
  const pass=document.getElementById("password").value;
  const role=document.getElementById("role").value;
  if(phone.length!==11 || !phone.startsWith("03")){ show("Sahi 11 wala Mobile Number likhein. Jaise 03001234567","#ff8585"); return; }
  if(pass.length<4){ show("Password kam se kam 4 harf ka ho.","#ff8585"); return; }
  const ref = db.ref("users/"+phone);
  const snap = await ref.get();
  if(snap.exists()){ show("Ye Number pehle se bana hua hai. Ab Login dabayein.","#ff8585"); return; }
  await ref.set({phone, password:pass, role, status:"pending", isOnline:false, createdAt:Date.now()});
  show("Mubarak! Account ban gaya.<br>Ab Admin ke Approve ka wait karein.<br>Approve ke baad Login hoga.","#7fffa0");
};

document.getElementById("loginBtn").onclick = async ()=>{
  const phone=document.getElementById("phone").value.trim();
  const pass=document.getElementById("password").value;
  const ref = db.ref("users/"+phone);
  const snap = await ref.get();
  if(!snap.exists()){ show("Ye Number bana hi nahi hua. Pehle New Account Banayein.","#ff8585"); return; }
  const u = snap.val();
  if(u.password !== pass){ show("Password ghalat hai.","#ff8585"); return; }
  if(u.status !== "approved"){ show("Aapka Account abhi Pending hai.<br>Admin ke Approve ka wait karein.","#ffcc00"); return; }
  if(u.isOnline === true){
    show("⚠️ Ye Number pehle se Login hai.<br>Pehle us Mobile se Logout karwayein.","#ff8585");
    return;
  }
  const sessionId = Date.now()+"_"+Math.random().toString(36).slice(2);
  await ref.update({isOnline:true, sessionId:sessionId, lastLogin:Date.now()});
  localStorage.setItem("jamia_phone", phone);
  localStorage.setItem("jamia_session", sessionId);
  localStorage.setItem("jamia_role", u.role);
  show("Login ho gaya! Home Page par ja rahe hain...","#7fffa0");
  document.getElementById("logoutBtn").style.display="block";
  setTimeout(()=>{ window.location.href="index.html"; }, 1000);
};

document.getElementById("logoutBtn").onclick = async ()=>{
  const phone = localStorage.getItem("jamia_phone");
  if(phone) await db.ref("users/"+phone).update({isOnline:false, sessionId:""});
  localStorage.clear();
  show("Logout ho gaya.","#7fffa0");
};

if(localStorage.getItem("jamia_phone")) document.getElementById("logoutBtn").style.display="block";
</script>
</body>
</html>
