<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration - Jamia Farooqia</title>
</head>
<body>

<h1>Jamia Farooqia Online Quran Academy</h1>
<h2>Student / Parents Registration Form</h2>

<form>
<label>Student Photo:</label>
<input type="file" accept="image/*" required><br><br>

<label>Student Name:</label>
<input type="text" required><br><br>

<label>Parent Name:</label>
<input type="text" required><br><br>

<label>Select Course:</label>
<select required>
<option value="">Select Course</option>
<option>Noorani Qaida</option>
<option>Nazra Quran</option>
<option>Hifz Quran</option>
<option>Tajweed Quran</option>
<option>Translation Quran</option>
<option>Six Kalimas</option>
<option>Namaz Course</option>
<option>Islamic Duas</option>
</select><br><br>

<label>Monthly Fee (Requested):</label>
<input type="number" required><br><br>

<label>City:</label>
<input type="text" required><br><br>

<label>Country:</label>
<input type="text" required><br><br>

<label>Parents Gmail:</label>
<input type="email" required><br><br>

<label>Parents Mobile Number:</label>
<input type="tel" required><br><br>

<label>Student WhatsApp Number:</label>
<input type="tel" required><br><br>

<button type="submit">Submit Registration</button>
</form>

</body>
</html>
