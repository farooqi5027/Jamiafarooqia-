<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamia Farooqia Admission</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f2;
            color: #173b2b;
            text-align: center;
        }

        .header {
            background: #0b5d3b;
            color: white;
            padding: 28px 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin: 10px 0 0;
            font-size: 17px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 15px;
        }

        .welcome {
            background: white;
            border-radius: 18px;
            padding: 25px 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .welcome h2 {
            margin-top: 0;
            color: #0b5d3b;
        }

        .welcome p {
            line-height: 1.6;
        }

        .option {
            display: block;
            text-decoration: none;
            margin: 18px 0;
            padding: 18px;
            border-radius: 12px;
            background: #0b5d3b;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .option:hover {
            background: #08482e;
        }

        .footer {
            margin-top: 35px;
            padding: 20px;
            background: #0b5d3b;
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Jamia Farooqia</h1>
        <p>Online Quran Academy</p>
    </div>

    <div class="container">

        <div class="welcome">
            <h2>Admission Page</h2>

            <p>
                Welcome to Jamia Farooqia Online Quran Academy.
                Please select an option below.
            </p>

            <a class="option" href="student-registration.html">
                I'm a Student / Parents
            </a>

            <a class="option" href="teacher-registration.html">
                I'm a Teacher
            </a>

            <a class="option" href="#">
                Login
            </a>
        </div>

    </div>

    <div class="footer">
        © Jamia Farooqia Online Quran Academy
    </div>

</body>
</html>
