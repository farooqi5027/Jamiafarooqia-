<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jamia Farooqia Translator</title>
<style>
body{font-family:Arial;background:#f0f7f2;margin:0;padding:15px}
.box{max-width:600px;margin:auto;background:white;border-radius:15px;padding:20px;box-shadow:0 2px 15px #0002}
h2{text-align:center;color:#087f23;margin:0}
p{ text-align:center;color:#666}
.langs{display:flex;gap:10px;align-items:center;margin-top:15px}
select{flex:1;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc}
textarea{width:100%;height:100px;margin-top:15px;padding:12px;font-size:18px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.btn{width:100%;padding:15px;margin-top:10px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer}
.mic{background:#087f23;color:white}
.trans{background:#2196F3;color:white}
.speak{background:#ff9800;color:white}
#out{margin-top:15px;background:#e8f5e9;padding:15px;border-radius:8px;font-size:19px;min-height:60px}
#status{text-align:center;color:#087f23;display:block;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2>🕌 Jamia Farooqia Translator</h2>
<p>Bolo ek zuban me, Suno doosri zuban me</p>

<div class="langs">
<select id="fromLang">
<option value="ur">Urdu - اردو</option>
<option value="en">English</option>
<option value="ar">Arabic - عربی</option>
<option value="ps">Pashto</option>
<option value="hi">Hindi</option>
</select>
<span style="font-size:24px">⇄</span>
<select id="toLang">
<option value="en">English</option>
<option value="ur">Urdu - اردو</option>
<option value="ar">Arabic - عربی</option>
<option value="ps">Pashto</option>
<option value="hi">Hindi</option>
</select>
</div>

<textarea id="inputText" placeholder="Yahan likho ya Mic dabao kar bolo..."></textarea>
<button class="btn mic" onclick="startMic()">🎤 Mic - Bolo</button>
<button class="btn trans" onclick="translateText()">Translate Karo ➜</button>

<div id="out">Tarjuma yahan aayega...</div>
<button class="btn speak" onclick="speakTranslated()">🔊 Tarjuma Suno (Doosri Zuban Me)</button>
<small id="status"></small>
</div>

<script>
// Activation Check - Agar Activate nahi to wapas bhejo
if(localStorage.getItem("appActivated") !== "yes"){
  window.location.href = "app-activation.html";
}

let translated = "";
let langMap = {ur:'ur-PK', en:'en-US', ar:'ar-SA', ps:'ps-AF', hi:'hi-IN'};

function startMic(){
  let from = document.getElementById("fromLang").value;
  document.getElementById("status").innerText = "Sun raha hoon... Bolo";
  let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = langMap[from] || 'ur-PK';
  rec.onresult = function(e){
    let text = e.results[0][0].transcript;
    document.getElementById("inputText").value = text;
    document.getElementById("status").innerText = "Mil gaya, ab Translate ho raha hai...";
    translateText();
  };
  rec.onerror = function(){ document.getElementById("status").innerText = "Mic me masla hai, dobara try karo"; };
  rec.start();
}

async function translateText(){
  let text = document.getElementById("inputText").value.trim();
  let from = document.getElementById("fromLang").value;
  let to = document.getElementById("toLang").value;
  if(!text){ alert("Pehle kuch likho ya bolo"); return; }
  if(from === to){ document.getElementById("out").innerText = text; translated = text; return; }
  document.getElementById("out").innerText = "Translate ho raha hai...";
  try{
    let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
    let res = await fetch(url);
    let data = await res.json();
    translated = data.responseData.translatedText;
    document.getElementById("out").innerText = translated;
    speakTranslated();
  }catch(e){
    document.getElementById("out").innerText = "Internet ka masla hai, dobara try karo";
  }
}

function speakTranslated(){
  if(!translated){ alert("Pehle Translate karo"); return; }
  let to = document.getElementById("toLang").value;
  let u = new SpeechSynthesisUtterance(translated);
  u.lang = langMap[to] || 'en-US';
  u.rate = 0.9;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  document.getElementById("status").innerText = "Ab sirf Tarjuma suna raha hoon...";
}
</script>
</body>
</html>
