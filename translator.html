<!DOCTYPE html>
<html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>App Activation</title>
<style>body{font-family:Arial;background:#f0f7f2;padding:15px} .box{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px;box-shadow:0 2px 15px #0002} h2{text-align:center;color:#087f23} input{width:100%;padding:13px;margin-top:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box} .btn{width:100%;padding:15px;margin-top:15px;border:none;border-radius:10px;background:#087f23;color:white;font-size:18px;font-weight:bold} #msg{text-align:center;margin-top:15px;font-weight:bold} small{color:#666}</style></head><body>
<div class="box">
<h2>🕌 Jamia Farooqia App</h2>
<p style="text-align:center"><small>1 dafa 20$ ada karo, Zindagi bhar Gmail se chalao</small></p>

<h3>STEP 1: Payment</h3>
<p>JazzCash / Easypaisa: <b>0300-XXXXXXX</b><br>Fees: <b>20$ / 5500 Rs</b></p>
<input id="name" placeholder="Apna Naam">
<input id="gmail" placeholder="Apna Gmail - jese ali@gmail.com">
<input id="whatsapp" placeholder="WhatsApp Number">
<input type="file" id="screenshot">
<button class="btn" style="background:#2196F3" onclick="sendPayment()">Payment Screenshot Bhejo</button>

<hr>
<h3>STEP 2: App Kholo</h3>
<input id="code" placeholder="Activation Code - jese JF-ABID-2026">
<input id="loginGmail" placeholder="Wohi Gmail dobara likho">
<button class="btn" onclick="activate()">Activate / Login with Gmail</button>
<p id="msg"></p>
<p style="text-align:center"><small>Mobile reset ho jaye to sirf Gmail se Login karo, Code dobara nahi lagega</small></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA_8i0yI2n8wR5fT4zJX-0BvZ0G2rLxZzZz",
  authDomain: "jamia-farooqia-app.firebaseapp.com",
  databaseURL: "https://jamia-farooqia-app-default-rtdb.firebaseio.com",
  projectId: "jamia-farooqia-app",
  storageBucket: "jamia-farooqia-app.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.sendPayment = async function(){
  let name = document.getElementById("name").value;
  let gmail = document.getElementById("gmail").value.toLowerCase().trim();
  if(!name || !gmail){ alert("Naam aur Gmail likho"); return; }
  await set(ref(db, "payments/" + gmail.replace(/\./g,"_")), {name:name, gmail:gmail, whatsapp:document.getElementById("whatsapp").value, time: new Date().toString(), status:"pending"});
  document.getElementById("msg").innerText = "Payment Request bhej di, Admin approve karega";
  document.getElementById("msg").style.color = "green";
}

window.activate = async function(){
  let code = document.getElementById("code").value.trim();
  let gmail = document.getElementById("loginGmail").value.toLowerCase().trim();
  let msg = document.getElementById("msg");
  if(!code || !gmail){ msg.innerText = "Code aur Gmail dono likho"; msg.style.color="red"; return; }
  if(!gmail.includes("@gmail.com")){ msg.innerText = "Sahi Gmail likho"; msg.style.color="red"; return; }

  msg.innerText = "Check ho raha hai..."; msg.style.color="black";

  // 1. Pehle dekho Gmail pehle se hai?
  let gmailKey = gmail.replace(/\./g,"_");
  let userSnap = await get(ref(db, "users/" + gmailKey));
  if(userSnap.exists()){
    // Purana user hai - Code match karo
    if(userSnap.val().code === code){
      localStorage.setItem("appActivated","yes");
      localStorage.setItem("userGmail", gmail);
      msg.innerText = "Welcome Back! App khul rahi hai..."; msg.style.color="green";
      setTimeout(()=>{ window.location.href="translator.html"; }, 1000);
      return;
    } else {
      msg.innerText = "Is Gmail par doosra Code hai!"; msg.style.color="red"; return;
    }
  }

  // 2. Naya user hai - Code check karo
  let codeSnap = await get(ref(db, "activationCodes/" + code));
  if(!codeSnap.exists()){ msg.innerText = "Ghalat Code!"; msg.style.color="red"; return; }
  let codeData = codeSnap.val();
  if(codeData.used === true && codeData.gmail !== gmail){
    msg.innerText = "Ye Code pehle se kisi aur ke Gmail par hai!"; msg.style.color="red"; return;
  }

  // 3. Code ko Gmail se Lock karo
  await set(ref(db, "activationCodes/" + code), {used:true, gmail:gmail, activatedAt: new Date().toString()});
  await set(ref(db, "users/" + gmailKey), {gmail:gmail, code:code, activatedAt: new Date().toString()});

  localStorage.setItem("appActivated","yes");
  localStorage.setItem("userGmail", gmail);
  msg.innerText = "Mubarak! App Activated, Gmail se Lock ho gayi"; msg.style.color="green";
  setTimeout(()=>{ window.location.href="translator.html"; }, 1000);
}
</script></body></html>
