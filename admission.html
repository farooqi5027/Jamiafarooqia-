<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admissions - Jamia Farooqia</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef5ef;
    min-height:100vh;
}

.header{
    background:#0a5c36;
    color:white;
    text-align:center;
    padding:30px 15px;
}

.header h1{
    font-size:30px;
    margin-bottom:8px;
}

.header p{
    font-size:15px;
}

.card{
    max-width:460px;
    margin:25px auto;
    background:white;
    padding:28px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
    text-align:center;
}

.card h2{
    color:#0a5c36;
    font-size:25px;
    margin-bottom:10px;
}

.card p{
    color:#555;
    line-height:1.6;
    font-size:14px;
    margin-bottom:20px;
}

.btn{
    display:block;
    width:100%;
    padding:15px;
    margin-top:13px;
    border-radius:10px;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    background:#0a5c36;
    color:white;
}

.btn.student{
    background:#c9a227;
    color:#000;
}

.btn.teacher{
    background:#0a5c36;
    color:white;
}
